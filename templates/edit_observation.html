{% extends "base.html" %}

{% block content %}

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;">
    <div>
      <h2>Edit observation</h2>
      <p style="margin:6px 0 0;">{{ obs.learner_name }} — {{ obs.class_name }} • {{ obs.created_at }}</p>
    </div>
    <div>
      <a href="{{ url_for('learner', learner_id=obs.learner_id) }}">Back</a>
    </div>
  </div>

  <form method="POST" style="margin-top:16px;display:grid;gap:12px;max-width:720px;">
    <div>
      <div style="font-size:12px;color:#374151;margin-bottom:6px;">Activity</div>
      <select name="activity" required style="padding:10px;border:1px solid #d1d5db;border-radius:10px;width:100%;">
        {% for a in ['Group work','Oral response','Practical task','Written task','Observation'] %}
          <option value="{{ a }}" {% if (activity or obs.activity) == a %}selected{% endif %}>{{ a }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <div style="font-size:12px;color:#374151;margin-bottom:6px;">Skill observed</div>
      <select name="skill" required style="padding:10px;border:1px solid #d1d5db;border-radius:10px;width:100%;">
        {% for s in ['Communication','Collaboration','Critical thinking','Creativity','Self-management'] %}
          <option value="{{ s }}" {% if (skill or obs.skill) == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <div style="font-size:12px;color:#374151;margin-bottom:6px;">Level</div>
      <select name="level" required style="padding:10px;border:1px solid #d1d5db;border-radius:10px;width:100%;">
        {% for lvl in ['Doing well','Improving','Needs support'] %}
          <option value="{{ lvl }}" {% if (level or obs.level) == lvl %}selected{% endif %}>{{ lvl }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <div style="font-size:12px;color:#374151;margin-bottom:6px;">Note (optional)</div>
      <textarea name="note" rows="3" style="padding:10px;border:1px solid #d1d5db;border-radius:10px;width:100%;">{{ note if note is not none else obs.note or '' }}</textarea>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <button type="submit" style="padding:12px 16px;border-radius:10px;border:1px solid #111827;background:#111827;color:#fff;cursor:pointer;">Save changes</button>
      <a href="{{ url_for('learner', learner_id=obs.learner_id) }}">Cancel</a>
    </div>
  </form>

  <form method="POST" action="{{ url_for('remove_observation', observation_id=obs.id) }}" onsubmit="return confirm('Delete this observation?');" style="margin-top:12px;">
    <button type="submit" style="padding:12px 16px;border-radius:10px;border:1px solid #b91c1c;background:#fff;color:#b91c1c;cursor:pointer;">Delete observation</button>
  </form>
</div>

{% endblock %}
