{% extends "base.html" %}

{% block content %}

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;">
    <div>
      <h2>Learners</h2>
      <p style="margin:6px 0 0;">Tap a learner to view history, or record a new observation.</p>
    </div>
    <div>
      <a href="{{ url_for('classes') }}" style="font-size:13px;">Back to classes</a>
    </div>
  </div>

  <div style="margin-top:16px;">
    {% for learner in learners %}
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
        <div>
          <div style="font-weight:600;">{{ learner.name }}</div>
          <div style="font-size:13px;color:#6b7280;">Learner record</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
          <a href="{{ url_for('learner', learner_id=learner.id) }}">View history</a>
          <a href="{{ url_for('observe', learner_id=learner.id, class_id=class_id) }}">Record</a>
        </div>
      </div>
    {% endfor %}
  </div>
</div>

{% endblock %}
